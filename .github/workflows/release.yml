name: Release

# Pushing a tag like v26.10.0 builds the app, tests it, and attaches
# Slipstream-Menubar.<version>.dmg, Slipstream-Menubar.app.<version>.zip,
# their SHA-256 sums and install.sh to a GitHub release for that tag. Running it by hand with a
# tag rebuilds the files of that existing release from the tagged commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v26.10.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0  # the build number comes from git describe

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          MARKETING_VERSION="$VERSION" scripts/build-app.sh

      - name: Package
        run: |
          APP="build/Slipstream Menubar.app"
          ZIP="Slipstream-Menubar.app.$VERSION.zip"
          DMG="Slipstream-Menubar.$VERSION.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          # The disk image opens to the app next to an Applications shortcut to drag it onto.
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Slipstream Menubar $VERSION" -srcfolder dmg -fs HFS+ -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$ZIP" "$DMG" | tee "SHA256SUMS.$VERSION.txt"

      - name: Release notes
        run: |
          # Install first, then "## Changes": the commits since the previous release tag.
          # The app's update window shows that section, found by its heading.
          PREVIOUS=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)
          RANGE="${PREVIOUS:+$PREVIOUS..}$TAG"
          {
            echo "Menu bar item for a local [Slipstream](https://github.com/npanj/slipstream) server."
            echo
            echo "## Install"
            echo
            echo "Paste into Terminal: it downloads this release, verifies its checksum, installs the app into"
            echo "/Applications, clears the quarantine mark and starts it."
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/npanj/slipstream-menubar/raw/main/install.sh | SLIPSTREAM_MENUBAR_TAG=$TAG sh"
            echo '```'
            echo
            echo "Or download one of"
            echo "- \`Slipstream-Menubar.$VERSION.dmg\`: open it and drag *Slipstream Menubar* onto *Applications*, or"
            echo "- \`Slipstream-Menubar.app.$VERSION.zip\`: unzip it and move *Slipstream Menubar.app* to /Applications."
            echo
            echo "Already installed? The app offers the update itself (menu → Check for Updates…)."
            echo
            echo "The app is signed ad hoc, not notarized, so macOS blocks a downloaded copy on first launch."
            echo "Allow it once with *System Settings → Privacy & Security → Open Anyway*, or run:"
            echo
            echo '```sh'
            echo 'xattr -dr com.apple.quarantine "/Applications/Slipstream Menubar.app"'
            echo '```'
            echo
            echo "Requires macOS 15 or later on Apple Silicon. The app installs Slipstream and a model for you."
            echo "Checksums: \`SHA256SUMS.$VERSION.txt\`."
            echo
            echo "## Changes"
            echo
            # Commits that only touch the agent's notes are left out.
            git log --no-merges --format='- %s' "$RANGE" -- . ':(exclude).claude'
          } > NOTES.md
          cat NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Slipstream Menubar ${{ env.VERSION }}
          files: |
            Slipstream-Menubar.${{ env.VERSION }}.dmg
            Slipstream-Menubar.app.${{ env.VERSION }}.zip
            SHA256SUMS.${{ env.VERSION }}.txt
            install.sh
          body_path: NOTES.md
